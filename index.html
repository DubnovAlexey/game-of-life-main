<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Life</title>
    <link rel="icon" type="image/webp" sizes="192x192" href="favicon.webp">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>
<body>
<h1>Game of Life</h1>
<p class="hint">Click or drag over the cells to bring them to life, then press Start. The field wraps around at the edges.</p>

<div class="controls">
    <button id="start" type="button">Start</button>
    <button id="step" type="button">Step</button>
    <button id="random" type="button">Random</button>
    <button id="clear" type="button">Clear</button>
    <label>Speed <input id="speed" type="range" min="1" max="10" value="5"></label>
</div>

<p class="stats">Generation: <b id="generation">0</b> · Live cells: <b id="population">0</b></p>

<div id="grid"></div>
<p class="source-link"><a href="https://github.com/DubnovAlexey/game-of-life-main" target="_blank" rel="noopener noreferrer">Source code on GitHub</a></p>
</body>
</html>
